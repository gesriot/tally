[package]
name = "tally-ui"
description = "Tally – планировщик дел в духе Things 3 (интерфейс на Slint)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Программа окна – `tally-ui`; имя `tally` у консольного клиента (`tally-cli`).
[[bin]]
name = "tally-ui"
path = "src/main.rs"

[lib]
name = "tally_ui"
path = "src/lib.rs"

[features]
default = ["skia"]
# Рендерер: Skia по умолчанию, femtovg – `--no-default-features --features femtovg`.
skia = ["slint/renderer-skia"]
femtovg = ["slint/renderer-femtovg"]

[dependencies]
anyhow.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
slint = { workspace = true, features = ["system-tray", "unstable-winit-030"] }
tally-app.workspace = true
tally-client.workspace = true
tally-core.workspace = true
tally-store.workspace = true
tally-when.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
global-hotkey = "0.10"
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
# Тестовая платформа Slint: окно без экрана, нажатия через доступность.
i-slint-backend-testing = "=1.19.0"
tempfile.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
