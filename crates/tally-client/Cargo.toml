[package]
name = "tally-client"
description = "Общее для консоли и окна Tally: путь к базе, сегодняшний день, русские даты, обмен с оконным процессом"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
directories.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }
tally-app.workspace = true
tally-core.workspace = true
tempfile.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tally-store.workspace = true

[lints]
workspace = true
